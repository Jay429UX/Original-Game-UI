<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Dicey — Dice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@dotlottie/player-component@2.7.12/dist/dotlottie-player.mjs" type="module"></script>
<style>
  :root {
    --bg: #0a0b0a;
    --surface: #111311;
    --surface-raised: #161816;
    --border: #1e201e;
    --border-focus: #00ab4c;
    --green-primary: #00ab4c;
    --green-glow: transparent;
    --green-dark: #007a36;
    --green-gradient-start: #0a1a0f;
    --green-gradient-end: #00ab4c;
    --text-primary: #e8eee8;
    --text-secondary: #6b756b;
    --text-muted: #3d433d;
    --radius: 8px;
    --radius-sm: 8px;
    --radius-xs: 8px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  body {
    font-family: 'Outfit', sans-serif;
    background: var(--bg);
    color: var(--text-primary);
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    overflow-x: hidden;
  }

  /* ── Shell ── */
  .app-shell {
    width: 100%;
    max-width: 420px;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    background: #0e100f;
    border: 1px solid rgba(255, 255, 255, 0.05);
    padding-bottom: 70px;
  }

  /* ── Header ── */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    position: relative;
    z-index: 10;
  }

  .header-brand {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .header-brand svg {
    width: 22px;
    height: 22px;
    fill: var(--text-primary);
  }

  .header-brand span {
    font-weight: 700;
    font-size: 18px;
    letter-spacing: -0.02em;
  }

  .header-brand small {
    font-size: 9px;
    font-weight: 500;
    letter-spacing: 0.08em;
    color: var(--text-secondary);
    display: block;
    margin-top: -2px;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .header-casino-link {
    display: none;
    align-items: center;
    gap: 6px;
    font-size: 14px;
    font-weight: 600;
    color: var(--green-primary);
    text-decoration: none;
    padding: 6px 12px;
    border-radius: var(--radius);
    transition: background 0.15s;
  }
  .header-casino-link:hover {
    background: rgba(0, 171, 76, 0.1);
  }
  .header-casino-link svg {
    width: 16px;
    height: 16px;
  }

  .balance-pill {
    background: var(--surface-raised);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 6px 14px 6px 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
  }

  .balance-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--green-primary);
    /* no glow */
  }

  .avatar {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--surface-raised);
    border: 1.5px solid var(--border);
    display: grid;
    place-items: center;
    font-size: 16px;
  }

  /* ── Main content: fills viewport ── */
  .main-content {
    display: flex;
    flex-direction: column;
    padding: 0 16px 16px;
    gap: 0;
  }

  /* ── Game Viewport ── */
  .game-viewport {
    border-radius: var(--radius) var(--radius) 0 0;
    overflow: hidden;
    position: relative;
    background: linear-gradient(to top, rgba(0,171,76,0.08) 0%, #0e100e 60%);
    border: 1px solid var(--border);
    border-bottom: none;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 14px;
    padding: 24px 20px 20px;
    height: calc(100dvh - 50px - 70px - 48px - 110px - 32px);
    min-height: 200px;
  }

  .star-canvas {
    position: absolute !important;
    inset: 0;
    width: 100% !important;
    height: 100% !important;
    z-index: 0;
    pointer-events: none;
    opacity: 0.5;
    display: block;
  }

  .game-viewport::after {
    content: '';
    position: absolute;
    inset: 0;
    background: url('assets/background.png') center/cover no-repeat;
    opacity: 0.2;
    z-index: 0;
    border-radius: var(--radius) var(--radius) 0 0;
    pointer-events: none;
  }

  .game-viewport > * {
    position: relative;
    z-index: 1;
  }

  .game-viewport .game-content {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    width: 100%;
    max-width: 340px;
  }


  .viewport-dice {
    position: absolute;
    z-index: 5;
    width: 48px;
    height: 58px; /* 48 box + 10 arrow */
    background: none;
    border: none;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    font-size: 24px;
    top: -66px;
    left: 50%;
    transform: translateX(-50%);
    overflow: visible;
    transition: left 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    animation: float 3s ease-in-out infinite;
  }

  .dice-shape {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }

  .dice-shape-fill {
    fill: #161816;
    stroke: rgba(255,255,255,0.06);
    stroke-width: 1;
    transition: fill 0.3s, stroke 0.3s;
  }

  .viewport-dice .dice-content {
    position: relative;
    z-index: 2;
    width: 48px;
    height: 48px;
    display: grid;
    place-items: center;
  }


  .viewport-dice.win-result .dice-shape-fill {
    fill: rgba(0, 171, 76, 0.15);
    stroke: var(--green-primary);
  }

  .viewport-dice.loss-result .dice-shape-fill {
    fill: rgba(220, 38, 38, 0.15);
    stroke: #dc2626;
  }

  .dice-particle {
    position: absolute;
    width: 5px;
    height: 5px;
    border-radius: 50%;
    pointer-events: none;
    z-index: 20;
    animation: particleBurst 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  @keyframes particleBurst {
    0% {
      opacity: 1;
      transform: translate(0, 0) scale(1);
    }
    100% {
      opacity: 0;
      transform: translate(var(--px), var(--py)) scale(0);
    }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50% { transform: translateY(-6px) rotate(3deg); }
  }

  @keyframes diceSpin {
    0% { transform: rotate(0deg) scale(1); }
    20% { transform: rotate(180deg) scale(1.2); }
    40% { transform: rotate(360deg) scale(1.1); }
    60% { transform: rotate(540deg) scale(1.15); }
    80% { transform: rotate(680deg) scale(1.05); }
    100% { transform: rotate(720deg) scale(1); }
  }


  .viewport-dice.spinning {
    animation: diceSpin 0.35s cubic-bezier(0.25, 0.1, 0.25, 1) forwards;
  }

  .viewport-dice.result {
    font-size: 18px;
    font-family: 'JetBrains Mono', monospace;
    font-weight: 700;
    animation: none;
    transform: translateX(-50%);
  }

  .viewport-dice.result.win-result {
    color: #00e65a;
    filter: drop-shadow(0 0 12px rgba(0, 171, 76, 0.3));
  }

  .viewport-dice.result.loss-result {
    color: #f87171;
    filter: drop-shadow(0 0 12px rgba(220, 38, 38, 0.3));
  }

  .viewport-label {
    position: relative;
    z-index: 1;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: -0.02em;
    color: rgba(255,255,255,0.9);
    /* no text-shadow */
  }

  .viewport-sublabel {
    position: relative;
    z-index: 1;
    font-size: 11px;
    font-weight: 500;
    color: rgba(255,255,255,0.4);
    letter-spacing: 0.06em;
  }

  /* ── Bet Controls Wrapper ── */
  .bet-controls {
    background: #161816;
    border-radius: 0 0 var(--radius) var(--radius);
    border: 1px solid rgba(255, 255, 255, 0.05);
    border-top: none;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    flex-shrink: 0;
  }

  /* ── Bet Mode Toggle ── */
  .bet-mode-toggle {
    display: flex;
    background: var(--surface);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    overflow: hidden;
    padding: 4px;
    gap: 4px;
  }

  .bet-mode-btn {
    flex: 1;
    padding: 9px 10px;
    border: none;
    border-radius: var(--radius-xs);
    background: transparent;
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .bet-mode-btn.active {
    background: var(--surface-raised);
    color: var(--text-primary);
  }

  /* ── Manual Bet Settings ── */
  .manual-settings {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .stat-fields {
    display: flex;
    flex-direction: column;
  }

  .stat-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 4px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.06);
  }

  .stat-row:last-child {
    border-bottom: none;
  }

  .stat-label {
    font-size: 13px;
    font-weight: 500;
    color: rgba(255, 255, 255, 0.4);
  }

  .stat-value {
    display: flex;
    align-items: center;
    gap: 2px;
  }

  .stat-number {
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
  }

  .stat-suffix {
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
  }

  /* ── Auto Bet Settings ── */
  .autobet-settings {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .autobet-field {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .autobet-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
  }

  .autobet-input-row {
    display: flex;
    align-items: stretch;
    gap: 0;
    border-radius: var(--radius-xs);
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
  }

  .autobet-input {
    flex: 1;
    min-width: 0;
    padding: 14px 14px;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Outfit', sans-serif;
    font-size: 16px;
    font-weight: 500;
    color: var(--text-primary);
    caret-color: var(--green-primary);
  }

  .autobet-input::placeholder {
    color: var(--text-muted);
  }

  .autobet-chips {
    display: flex;
    align-items: center;
    border-left: 1px solid var(--border);
  }

  .autobet-chip {
    padding: 10px 12px;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease;
    border-left: 1px solid var(--border);
  }

  .autobet-chip:first-child {
    border-left: none;
  }

  .autobet-chip:hover {
    color: var(--green-primary);
    background: rgba(0, 171, 76, 0.06);
  }

  .autobet-toggle-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .autobet-seg {
    display: flex;
    background: var(--surface);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    overflow: hidden;
    padding: 4px;
    gap: 4px;
  }

  .autobet-seg-btn {
    flex: 1;
    padding: 9px 8px;
    border: none;
    border-radius: var(--radius-xs);
    background: transparent;
    color: var(--text-muted);
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .autobet-seg-btn.active {
    background: var(--surface-raised);
    color: var(--text-primary);
  }

  .autobet-pct {
    display: flex;
    align-items: center;
    border-radius: var(--radius-xs);
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
  }

  .autobet-pct-input {
    flex: 1;
    min-width: 0;
    padding: 8px 12px;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 500;
    color: var(--text-primary);
    caret-color: var(--green-primary);
  }

  .autobet-pct-sign {
    padding: 8px 12px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    border-left: 1px solid var(--border);
    background: var(--surface-raised);
  }

  .autobet-stop-row {
    display: flex;
    align-items: stretch;
    border-radius: var(--radius-xs);
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
  }

  .autobet-stop-row .currency-tag {
    padding: 0 10px;
    font-size: 13px;
  }

  .autobet-stop-input {
    border: none !important;
    border-radius: 0 !important;
  }

  /* ── Bet Button ── */
  .bet-button {
    width: 100%;
    height: 48px;
    padding: 0 16px;
    border: none;
    border-radius: var(--radius);
    background: var(--green-primary);
    color: #fff;
    font-family: 'Outfit', sans-serif;
    font-size: 17px;
    font-weight: 700;
    letter-spacing: -0.01em;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.15);
  }

  .bet-button:active {
    transform: scale(0.97);
    box-shadow: none;
  }

  .bet-button::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(255,255,255,0.12) 0%, transparent 50%);
    pointer-events: none;
  }

  .bet-button::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -50%;
    width: 200%;
    height: 200%;
    background: radial-gradient(circle, rgba(255,255,255,0.15) 0%, transparent 60%);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }

  .bet-button:hover::after {
    opacity: 1;
  }

  .bet-button .btn-content {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .bet-button .btn-content svg {
    width: 18px;
    height: 18px;
  }

  /* ── Bet Input Group ── */
  .input-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .input-label {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .input-label span {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary);
    letter-spacing: 0.04em;
  }

  .input-label .potential-win {
    font-family: 'Outfit', sans-serif;
    font-size: 12px;
    color: var(--green-primary);
    text-transform: none;
    letter-spacing: 0;
  }

  .input-row {
    display: flex;
    align-items: stretch;
    gap: 0;
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
    background: var(--surface);
    overflow: hidden;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
  }

  .input-row:focus-within {
    border-color: var(--border-focus);
    box-shadow: 0 0 0 3px rgba(0, 171, 76, 0.15);
  }

  .currency-tag {
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-family: 'Outfit', sans-serif;
    font-size: 14px;
    font-weight: 600;
    color: var(--text-secondary);
    background: var(--surface-raised);
    border-right: 1px solid var(--border);
    user-select: none;
  }

  .bet-input {
    flex: 1;
    min-width: 0;
    padding: 18px 12px;
    border: none;
    outline: none;
    background: transparent;
    font-family: 'Outfit', sans-serif;
    font-size: 18px;
    font-weight: 500;
    color: var(--text-primary);
    caret-color: var(--green-primary);
  }

  .bet-input::placeholder {
    color: var(--text-muted);
  }

  .quick-amounts {
    display: flex;
    align-items: center;
    border-left: 1px solid var(--border);
  }

  .quick-btn {
    min-width: 48px;
    padding: 18px 0;
    border: none;
    background: transparent;
    color: var(--text-secondary);
    font-family: 'Outfit', sans-serif;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease;
    border-left: 1px solid var(--border);
    text-align: center;
  }

  .quick-btn:first-child {
    border-left: none;
  }

  .quick-btn:hover {
    color: var(--green-primary);
    background: rgba(0, 171, 76, 0.06);
  }

  .quick-btn:active {
    background: rgba(0, 171, 76, 0.1);
  }

  /* ── Game Options (inside viewport) ── */
  .game-options {
    position: relative;
    z-index: 1;
    display: flex;
    gap: 5px;
    width: 100%;
    max-width: 340px;
  }

  .option-chip {
    flex: 1;
    padding: 7px 4px;
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: var(--radius-xs);
    background: rgba(255,255,255,0.06);
    color: rgba(255,255,255,0.5);
    font-family: 'Outfit', sans-serif;
    font-size: 10px;
    font-weight: 600;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s ease;
    backdrop-filter: blur(4px);
    white-space: nowrap;
  }

  .option-chip:hover {
    border-color: rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.8);
  }

  .option-chip.active {
    border-color: var(--green-primary);
    background: rgba(0, 171, 76, 0.12);
    color: #fff;
    box-shadow: 0 0 0 1px var(--green-primary);
  }

  /* ── Slider ── */
  .slider-outer {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    background: #161816;
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px;
    padding: 18px 20px 28px;
    margin-top: 56px;
    overflow: visible;
  }

  .slider-container {
    position: relative;
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .slider-value-display {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
  }

  .slider-value {
    font-family: 'Outfit', sans-serif;
    font-size: 28px;
    font-weight: 700;
    color: #fff;
    /* no text-shadow */
    min-width: 50px;
    text-align: center;
  }

  .slider-separator {
    font-size: 14px;
    color: rgba(255,255,255,0.3);
    font-weight: 500;
  }

  .slider-track-wrapper {
    position: relative;
    height: 40px;
    display: flex;
    align-items: center;
  }

  .slider-track {
    position: absolute;
    width: 100%;
    height: 10px;
    background: rgba(255,255,255,0.05);
    border-radius: 5px;
    overflow: visible;
    box-shadow: inset 0 1px 3px rgba(0,0,0,0.4);
    outline: none;
    border: none;
  }

  .slider-track::before {
    content: '';
    position: absolute;
    inset: -5px;
    border-radius: 10px;
    background: linear-gradient(180deg, rgba(0,0,0,0.12) 0%, rgba(0,0,0,0.04) 100%);
    border: 1px solid rgba(255,255,255,0.06);
    border-top-color: rgba(255,255,255,0.03);
    border-bottom-color: rgba(255,255,255,0.08);
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.15), inset 0 -1px 2px rgba(255,255,255,0.04);
    z-index: -1;
  }

  .slider-fill {
    position: absolute;
    left: 0;
    width: 100%;
    height: 100%;
    border-radius: 5px;
    transition: background 0.15s ease;
    overflow: hidden;
  }

  .slider-fill::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 5px;
    background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, transparent 50%, rgba(0,0,0,0.10) 100%);
    pointer-events: none;
  }

  .slider-fill::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 5px;
    background: rgba(255,255,255,0);
    animation: neonPulse 3s ease-in-out infinite;
    pointer-events: none;
  }

  @keyframes neonPulse {
    0%, 100% { background: rgba(255,255,255,0); }

    /* Desktop settings strip — full width bottom */
    .desktop-settings-strip {

      grid-row: 2;

    /* Reposition settings popup for desktop — anchor to bottom strip */
    .settings-popup {
      position: fixed;
      bottom: 60px;
      left: 20px;
      z-index: 100;
    }
  }

<script>
  // ── State ──
  const betInput = document.getElementById('betAmount');
  const potentialWin = document.getElementById('potentialWin');
  const multInput = document.getElementById('multInput');
  const winProbInput = document.getElementById('winProbInput');
  const modeLabel = document.getElementById('modeLabel');
  const sliderA = document.getElementById('sliderA');
  const sliderB = document.getElementById('sliderB');
  const sliderValA = document.getElementById('sliderValA');
  const sliderValB = document.getElementById('sliderValB');
  const sliderSep = document.getElementById('sliderSep');
  const sliderFill = document.getElementById('sliderFill');
  const balance = 100;
  let currentMode = 'rollover';

  // ── Multiplier calc ──
  function getMultiplier() {
    const a = parseInt(sliderA.value);
    const b = parseInt(sliderB.value);
    let winChance;
    if (currentMode === 'rollover') winChance = (100 - a) / 100;
    else if (currentMode === 'rollunder') winChance = (a - 1) / 100;
    else if (currentMode === 'between') {
      const lo = Math.min(a, b), hi = Math.max(a, b);
      winChance = (hi - lo + 1) / 100;
    } else {
      const lo = Math.min(a, b), hi = Math.max(a, b);
      winChance = (100 - (hi - lo + 1)) / 100;
    }
    winChance = Math.max(winChance, 0.01);
    return Math.floor((0.99 / winChance) * 10000) / 10000;
  }

  // ── Update UI ──
  function updateSliderUI() {
    const a = parseInt(sliderA.value);
    const b = parseInt(sliderB.value);
    const isRange = currentMode === 'between' || currentMode === 'outside';

    if (sliderValA) sliderValA.textContent = a;
    if (sliderValB) sliderValB.textContent = b;
    if (sliderSep) sliderSep.style.display = isRange ? '' : 'none';
    if (sliderValB) sliderValB.style.display = isRange ? '' : 'none';
    sliderB.style.display = isRange ? '' : 'none';

    // Fill bar — green = win zone, red = loss zone (neon liquid style)
    const red = '#dc2626';
    const green = '#00ab4c';
    if (currentMode === 'rollover') {
      sliderFill.style.background = `linear-gradient(to right, ${red} ${a}%, ${green} ${a}%)`;
      sliderFill.style.boxShadow = `inset 0 0 6px rgba(220,38,38,0.3), inset 0 0 6px rgba(0,171,76,0.3)`;
    } else if (currentMode === 'rollunder') {
      sliderFill.style.background = `linear-gradient(to right, ${green} ${a}%, ${red} ${a}%)`;
      sliderFill.style.boxShadow = `inset 0 0 6px rgba(0,171,76,0.3), inset 0 0 6px rgba(220,38,38,0.3)`;
    } else {
      const lo = Math.min(a, b), hi = Math.max(a, b);
      if (currentMode === 'between') {
        sliderFill.style.background = `linear-gradient(to right, ${red} ${lo}%, ${green} ${lo}%, ${green} ${hi}%, ${red} ${hi}%)`;
      } else {
        sliderFill.style.background = `linear-gradient(to right, ${green} ${lo}%, ${red} ${lo}%, ${red} ${hi}%, ${green} ${hi}%)`;
      }
      sliderFill.style.boxShadow = `inset 0 0 6px rgba(0,171,76,0.3), inset 0 0 6px rgba(220,38,38,0.3)`;
    }

    // Mode label
    const labels = {
      rollover: `Roll over ${a} to win`,
      rollunder: `Roll under ${a} to win`,
      between: `Roll ${Math.min(a,b)}–${Math.max(a,b)} to win`,
      outside: `Roll outside ${Math.min(a,b)}–${Math.max(a,b)} to win`
    };
    modeLabel.textContent = labels[currentMode];

    // Multiplier & win probability
    const mult = getMultiplier();
    const winChance = Math.min(99, Math.max(0.01, (0.99 / mult) * 100));
    multInput.textContent = mult.toFixed(4);
    winProbInput.textContent = parseFloat(winChance.toFixed(2));
    updateWin(mult);
  }

  function updateWin(mult) {
    const m = mult || getMultiplier();
    const val = parseFloat(betInput.value) || 0;
    const win = (val * m).toFixed(2);
    potentialWin.textContent = `Win: $${win} (${m.toFixed(2)}x)`;
  }

  // ── Slider tick sound ──
  let lastTickVal = { a: parseInt(sliderA.value), b: parseInt(sliderB.value) };
  // Pre-load click sound pool for rapid slider ticks
  const clickPool = [];
  const CLICK_POOL_SIZE = 6;
  for (let i = 0; i < CLICK_POOL_SIZE; i++) {
    const a = new Audio('assets/clicks.mp3');
    a.volume = 0.03;
    clickPool.push(a);
  }
  let clickPoolIndex = 0;

  function playSliderTick() {
    if (!soundEnabled) return;
    try {
      const a = clickPool[clickPoolIndex];
      a.currentTime = 0;
      a.play().catch(() => {});
      clickPoolIndex = (clickPoolIndex + 1) % CLICK_POOL_SIZE;
    } catch(e) {}
  }

  function onSliderInput(slider, key) {
    const val = parseInt(slider.value);
    if (val !== lastTickVal[key]) {
      lastTickVal[key] = val;
      playSliderTick();
    }
    updateSliderUI();
  }

  // ── Slider events ──
  sliderA.addEventListener('input', () => onSliderInput(sliderA, 'a'));
  sliderB.addEventListener('input', () => onSliderInput(sliderB, 'b'));
  betInput.addEventListener('input', () => updateWin());

  // ── Quick amount buttons ──
  let maxConfirmPending = false;
  const maxBtn = document.querySelector('.quick-btn[data-action="max"]');

  document.querySelectorAll('.quick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const action = btn.dataset.action;
      let val = parseFloat(betInput.value) || 0;

      if (action === 'max') {
        if (!maxConfirmPending) {
          maxConfirmPending = true;
          maxBtn.textContent = 'Confirm';
          maxBtn.style.color = 'var(--green-primary)';
          maxBtn.style.padding = '18px 14px';
          setTimeout(() => {
            if (maxConfirmPending) {
              maxConfirmPending = false;
              maxBtn.textContent = 'Max';
              maxBtn.style.color = '';
              maxBtn.style.padding = '';
            }
          }, 3000);
          return;
        }
        maxConfirmPending = false;
        maxBtn.textContent = 'Max';
        maxBtn.style.color = '';
        maxBtn.style.padding = '';
        val = balance;
      } else {
        if (maxConfirmPending) {
          maxConfirmPending = false;
          maxBtn.textContent = 'Max';
          maxBtn.style.color = '';
          maxBtn.style.padding = '';
        }
        if (action === 'half') val = val / 2;
        if (action === 'double') val = val * 2;
      }

      betInput.value = Math.max(0, Math.min(val, balance)).toFixed(2);
      updateWin();
    });
  });

  // ── Game type chips ──
  document.querySelectorAll('.option-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      document.querySelectorAll('.option-chip').forEach(c => c.classList.remove('active'));
      chip.classList.add('active');
      currentMode = chip.dataset.type;
      // Reset slider defaults per mode
      if (currentMode === 'rollover') { sliderA.value = 50; }
      else if (currentMode === 'rollunder') { sliderA.value = 50; }
      else if (currentMode === 'between') { sliderA.value = 30; sliderB.value = 70; }
      else if (currentMode === 'outside') { sliderA.value = 40; sliderB.value = 60; }
      updateSliderUI();
    });
  });

  // ── Bet button ──
  const resultTrack = document.getElementById('resultTrack');
  const viewportDice = document.getElementById('viewportDice');
  const diceText = viewportDice.querySelector('.dice-text');
  const diceLottie = viewportDice.querySelector('.dice-lottie');
  let diceResetTimer = null;
  let diceCountAnim = null;

  function rollDice() {
    const roll = Math.floor(Math.random() * 100) + 1;
    const a = parseInt(sliderA.value);
    const b = parseInt(sliderB.value);
    let isWin = false;

    if (currentMode === 'rollover') isWin = roll > a;
    else if (currentMode === 'rollunder') isWin = roll < a;
    else if (currentMode === 'between') {
      const lo = Math.min(a, b), hi = Math.max(a, b);
      isWin = roll >= lo && roll <= hi;
    } else {
      const lo = Math.min(a, b), hi = Math.max(a, b);
      isWin = roll < lo || roll > hi;
    }

    const mult = getMultiplier();

    // Button press effect
    const btn = document.getElementById('betBtn');
    btn.style.transform = 'scale(0.95)';
    setTimeout(() => btn.style.transform = '', 80);

    // Cancel any pending reset or count animation
    if (diceResetTimer) clearTimeout(diceResetTimer);
    if (diceCountAnim) cancelAnimationFrame(diceCountAnim);

    // Animate dice: count up numbers + slide horizontally along bar
    viewportDice.classList.remove('spinning', 'result', 'win-result', 'loss-result');
    viewportDice.classList.add('result');
    // Hide lottie, show number
    diceLottie.style.display = 'none';
    diceText.style.display = '';
    // Start at left edge (1%), CSS transition handles the slide
    viewportDice.style.transition = 'none';
    viewportDice.style.left = '0%';
    playDiceSound();

    // Force reflow then animate to final position
    viewportDice.offsetWidth;
    viewportDice.style.transition = 'left 0.3s cubic-bezier(0.22, 1, 0.36, 1)';
    viewportDice.style.left = roll + '%';

    const duration = 300; // ms for count animation
    const startTime = performance.now();

    function animateCount(now) {
      const elapsed = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased = 1 - Math.pow(1 - progress, 3);
      const current = Math.round(1 + eased * (roll - 1));
      diceText.textContent = current;

      if (progress < 1) {
        diceCountAnim = requestAnimationFrame(animateCount);
      } else {
        diceText.textContent = roll;
        viewportDice.classList.add(isWin ? 'win-result' : 'loss-result');
        spawnParticles(isWin);
        playResultSound(isWin);
      }
    }
    diceCountAnim = requestAnimationFrame(animateCount);

    // Show result pill
    const pill = document.createElement('div');
    pill.className = `result-pill ${isWin ? 'win' : 'loss'}`;
    pill.textContent = isWin ? '+' + mult.toFixed(2) + 'x' : '0.00x';
    resultTrack.appendChild(pill);
    resultTrack.scrollLeft = resultTrack.scrollWidth;

    // Reset dice back to lottie after idle
    diceResetTimer = setTimeout(() => {
      viewportDice.classList.remove('result', 'win-result', 'loss-result');
      diceText.style.display = 'none';
      diceLottie.style.display = '';
      viewportDice.style.transition = 'left 0.3s ease';
      viewportDice.style.left = '50%';
    }, 800);
  }

  // ── Autobet state ──
  let autobetRunning = false;
  let autobetTimer = null;
  let autobetRemaining = 0;

  function getAutobetSettings() {
    const numBetsInput = document.getElementById('numBets');
    const numBets = numBetsInput.value === '' ? Infinity : parseInt(numBetsInput.value) || 10;
    return { numBets };
  }

  function stopAutobet() {
    autobetRunning = false;
    if (autobetTimer) { clearTimeout(autobetTimer); autobetTimer = null; }
    const btnEl = document.getElementById('betBtn');
    btnEl.querySelector('.btn-content').textContent = 'Start Autobet';
  }

  function runAutobetRound() {
    if (!autobetRunning || autobetRemaining <= 0) { stopAutobet(); return; }

    rollDice();
    autobetRemaining--;

    if (autobetRemaining <= 0) {
      // Let the last animation finish then stop
      diceResetTimer = setTimeout(() => { stopAutobet(); }, 800);
      return;
    }

    // Wait for dice animation to finish then run next round
    autobetTimer = setTimeout(runAutobetRound, 1200);
  }

  function startAutobet() {
    const settings = getAutobetSettings();
    autobetRunning = true;
    autobetRemaining = settings.numBets;
    const btnEl = document.getElementById('betBtn');
    btnEl.querySelector('.btn-content').textContent = 'Stop Autobet';
    runAutobetRound();
  }

  document.getElementById('betBtn').addEventListener('click', () => {
    const isAuto = document.querySelector('.bet-mode-btn.active')?.dataset.mode === 'auto';
    if (isAuto) {
      if (autobetRunning) stopAutobet();
      else startAutobet();
    } else {
      rollDice();
    }
  });

  // ── Bet mode toggle ──
  const autobetPanel = document.getElementById('autobetSettings');
  const manualPanel = document.getElementById('manualSettings');
  document.querySelectorAll('.bet-mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.bet-mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const isAuto = btn.dataset.mode === 'auto';
      autobetPanel.style.display = isAuto ? '' : 'none';
      manualPanel.style.display = isAuto ? 'none' : '';
      document.getElementById('betBtn').querySelector('.btn-content').textContent = isAuto ? 'Start Autobet' : 'Bet Now';
    });
  });

  // ── Manual settings: reverse sync (input → slider) ──
  function setSliderFromMultiplier(mult) {
    mult = Math.max(1.01, mult);
    const winChance = 0.99 / mult;
    if (currentMode === 'rollover') {
      sliderA.value = Math.round(100 - winChance * 100);
    } else if (currentMode === 'rollunder') {
      sliderA.value = Math.round(winChance * 100 + 1);
    }
    // For between/outside, reverse is ambiguous so we don't adjust the slider
    updateSliderUI();
  }

  // Multiplier and win probability are display-only, updated by the slider

  // ── Autobet number chips ──
  document.querySelectorAll('.autobet-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      const v = chip.dataset.bets;
      document.getElementById('numBets').value = v === 'Infinity' ? '' : v;
      if (v === 'Infinity') document.getElementById('numBets').placeholder = '∞';
    });
  });

  // ── On Win / On Loss segmented toggles ──
  document.querySelectorAll('.autobet-seg-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const seg = btn.closest('.autobet-seg');
      seg.querySelectorAll('.autobet-seg-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const target = btn.dataset.target;
      const pctEl = document.getElementById(target + 'Pct');
      pctEl.style.display = btn.dataset.action === 'increase' ? '' : 'none';
    });
  });

  // ── Dice Sound ──
  const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  const diceRollAudio = new Audio('assets/rolling_dice_on_a_fe_%231-1773530914159.mp3');
  diceRollAudio.volume = 0.5;

  function playDiceSound() {
    if (!soundEnabled) return;
    diceRollAudio.currentTime = 0;
    diceRollAudio.play().catch(() => {});
  }

  function playResultSound(isWin) {
    if (!soundEnabled) return;
    const now = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.type = 'sine';

    if (isWin) {
      osc.frequency.setValueAtTime(523, now);
      osc.frequency.setValueAtTime(659, now + 0.08);
      osc.frequency.setValueAtTime(784, now + 0.16);
      gain.gain.setValueAtTime(0.1, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
      osc.start(now);
      osc.stop(now + 0.3);
    } else {
      osc.frequency.setValueAtTime(330, now);
      osc.frequency.setValueAtTime(260, now + 0.1);
      gain.gain.setValueAtTime(0.08, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
      osc.start(now);
      osc.stop(now + 0.25);
    }
  }

  // ── Turbo & Sound State ──
  let turboMode = false;
  let soundEnabled = true;

  // ── Settings Popup ──
  const settingsPopup = document.getElementById('settingsPopup');
  const soundToggle = document.getElementById('soundToggle');
  const turboSettingsToggle = document.getElementById('turboSettingsToggle');
  const settingsBtnEl = document.getElementById('settingsBtn');

  const desktopSettingsBtnEl = document.getElementById('desktopSettingsBtn');

  function toggleSettings(e) {
    e.stopPropagation();
    settingsPopup.classList.toggle('visible');
    const isOpen = settingsPopup.classList.contains('visible');
    if (settingsBtnEl) settingsBtnEl.classList.toggle('active', isOpen);
    if (desktopSettingsBtnEl) desktopSettingsBtnEl.classList.toggle('active', isOpen);
  }

  if (settingsBtnEl) settingsBtnEl.addEventListener('click', toggleSettings);
  if (desktopSettingsBtnEl) desktopSettingsBtnEl.addEventListener('click', toggleSettings);

  document.addEventListener('click', (e) => {
    if (!settingsPopup.contains(e.target) && e.target !== settingsBtnEl && e.target !== desktopSettingsBtnEl && !desktopSettingsBtnEl?.contains(e.target) && !settingsBtnEl?.contains(e.target)) {
      settingsPopup.classList.remove('visible');
      if (settingsBtnEl) settingsBtnEl.classList.remove('active');
      if (desktopSettingsBtnEl) desktopSettingsBtnEl.classList.remove('active');
    }
  });

  soundToggle.classList.add('active');
  soundToggle.addEventListener('click', () => {
    soundEnabled = !soundEnabled;
    soundToggle.classList.toggle('active', soundEnabled);
  });

  turboSettingsToggle.addEventListener('click', () => {
    turboMode = !turboMode;
    turboSettingsToggle.classList.toggle('active', turboMode);
  });

  // ── Particle Explosion ──
  function spawnParticles(isWin) {
    const rect = viewportDice.getBoundingClientRect();
    const parent = viewportDice.closest('.slider-outer');
    const parentRect = parent.getBoundingClientRect();
    const cx = rect.left - parentRect.left + rect.width / 2;
    const cy = rect.top - parentRect.top + rect.height / 2;
    const count = isWin ? 14 : 8;
    const colors = isWin
      ? ['#00e65a', '#00ab4c', '#66ffaa', '#00ff7f', '#aaffcc']
      : ['#f87171', '#dc2626', '#ff9999', '#ef4444', '#fca5a5'];

    for (let i = 0; i < count; i++) {
      const p = document.createElement('div');
      p.className = 'dice-particle';
      const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.5;
      const dist = 30 + Math.random() * 40;
      const px = Math.cos(angle) * dist;
      const py = Math.sin(angle) * dist;
      p.style.setProperty('--px', px + 'px');
      p.style.setProperty('--py', py + 'px');
      p.style.left = cx + 'px';
      p.style.top = cy + 'px';
      p.style.width = (3 + Math.random() * 4) + 'px';
      p.style.height = p.style.width;
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.boxShadow = `0 0 6px ${p.style.background}`;
      parent.appendChild(p);
      p.addEventListener('animationend', () => p.remove());
    }
  }

  // ── Generate slider tick marks + labels ──
  (function() {
    const ticks = document.getElementById('sliderTicks');
    const labels = document.getElementById('sliderLabels');
    const padding = 20;
    const majorValues = [1, 25, 50, 75, 100];

    // Build tick values: every 5 steps, but skip any that are within 3 of a major value
    const tickValues = new Set(majorValues);
    for (let i = 1; i <= 100; i += 5) {
      const tooClose = majorValues.some(m => m !== i && Math.abs(m - i) < 4);
      if (!tooClose) tickValues.add(i);
    }
    const sorted = Array.from(tickValues).sort((a, b) => a - b);

    for (const val of sorted) {
      const tick = document.createElement('span');
      const pct = (val - 1) / 99 * 100;
      const pos = `calc(${padding}px + (100% - ${padding * 2}px) * ${pct / 100})`;
      tick.style.left = pos;
      if (majorValues.includes(val)) {
        tick.className = 'tick-major';
        const label = document.createElement('span');
        label.textContent = val;
        label.style.left = pos;
        labels.appendChild(label);
      }
      ticks.appendChild(tick);
    }
  })();


  // ── Starfield ──
  (function initStarfield() {
    const canvas = document.getElementById('starCanvas');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const stars = [];
    const STAR_COUNT = 80;

    function resize() {
      const vp = canvas.parentElement;
      canvas.width = vp.clientWidth;
      canvas.height = vp.clientHeight;
    }

    function createStars() {
      stars.length = 0;
      for (let i = 0; i < STAR_COUNT; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          r: Math.random() * 1.2 + 0.3,
          alpha: Math.random(),
          speed: Math.random() * 0.005 + 0.002,
          phase: Math.random() * Math.PI * 2
        });
      }
    }

    let frameId;
    function draw(t) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (const s of stars) {
        const twinkle = 0.3 + 0.7 * ((Math.sin(t * s.speed + s.phase) + 1) / 2);
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(255,255,255,${twinkle * 0.7})`;
        ctx.fill();
      }
      frameId = requestAnimationFrame(draw);
    }

    resize();
    createStars();
    frameId = requestAnimationFrame(draw);

    window.addEventListener('resize', () => {
      resize();
      createStars();
    });
  })();

  // ── Init ──
  updateSliderUI();
</script>

</body>
</html>
